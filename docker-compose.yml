services:
  link-core:
    build: .
    container_name: link_core_agent
    ports:
      - "8000:8000"
    volumes:
      # Map the local data directory to preserve LORE across reboots
      - ./data/memory.sqlite:/app/memory.sqlite
      - ./data/chroma_db:/app/chroma_db
      - ./link-core.log:/app/link-core.log
    env_file:
      - .env
    restart: unless-stopped