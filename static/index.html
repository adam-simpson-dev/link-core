<!DOCTYPE html>
<html>
<head>
    <title>LINK-CORE | Panopticon</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body { margin: 0; background: #000510; color: #00ffff; font-family: monospace; overflow: hidden; }
        .ui-panel { position: absolute; z-index: 10; pointer-events: none; }
        #left-panel { top: 10px; left: 10px; width: 300px; }
        #right-panel { top: 10px; right: 10px; width: 280px; }
        
        /* The Terminal Panel */
        #terminal-panel { bottom: 20px; left: 50%; transform: translateX(-50%); width: 600px; }
        
        .box { 
            background: rgba(0, 15, 25, 0.85); 
            border: 1px solid #00ffff; 
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
            padding: 15px; margin-bottom: 15px; pointer-events: auto; border-radius: 4px;
            backdrop-filter: blur(4px);
        }
        
        h2 { margin: 0 0 10px 0; font-size: 14px; text-transform: uppercase; color: #ffffff; text-shadow: 0 0 8px #00ffff; letter-spacing: 2px;}
        
        .prop-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,255,255,0.2); padding: 4px 0;}
        .prop-key { color: #88ffff; }
        .prop-val { color: #ffffff; text-align: right;}

        /* Terminal Specific Styling */
        #chat-log { max-height: 180px; overflow-y: auto; margin-bottom: 10px; font-size: 12px; line-height: 1.5; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: #00ffff rgba(0,0,0,0.5); }
        .msg-user { color: #ffffff; text-align: left; opacity: 0.8; }
        .msg-ai { color: #00ffff; text-align: left; text-shadow: 0 0 5px #00ffff; }
        .msg-sys { color: #ff0044; text-align: center; font-weight: bold; }
        
        #chat-input-wrapper { display: flex; align-items: center; border-top: 1px solid rgba(0,255,255,0.3); padding-top: 10px; }
        #chat-input-wrapper span { color: #00ffff; margin-right: 10px; font-weight: bold; }
        #chat-input { background: transparent; border: none; color: #00ffff; font-family: monospace; font-size: 14px; flex-grow: 1; outline: none; }
        #chat-input::placeholder { color: rgba(0, 255, 255, 0.3); }
    </style>
</head>
<body>
    <div class="ui-panel" id="left-panel">
        <div class="box">
            <h2>System State</h2>
            <div id="system-status" style="font-weight: bold;">NOMINAL</div>
        </div>
        <div class="box">
            <h2>Active Memory</h2>
            <div id="memory-log" style="font-size: 11px; height: 240px; overflow: hidden; line-height: 1.4; display: flex; flex-direction: column; justify-content: flex-end;"></div>
        </div>
    </div>

    <div class="ui-panel" id="right-panel">
        <div class="box" id="inspector-box" style="display: none;">
            <h2 id="inspect-name">NODE</h2>
            <div style="font-size: 10px; color: #888; margin-bottom: 10px;" id="inspect-uid"></div>
            <div id="inspect-props"></div>
        </div>
    </div>

    <div class="ui-panel" id="terminal-panel">
        <div class="box">
            <h2>Uplink Terminal</h2>
            <div id="chat-log">
                <div class="msg-sys">AWAITING INPUT...</div>
            </div>
            <div id="chat-input-wrapper">
                <span>></span>
                <input type="text" id="chat-input" placeholder="Execute command or query LORE..." autocomplete="off">
            </div>
        </div>
    </div>
    
    <div id="3d-graph"></div>

    <script type="module">
        import * as THREE from 'https://esm.sh/three';
        import ForceGraph3D from 'https://esm.sh/3d-force-graph';

        // --- OPTIMIZED GRAPH ENGINE ---
        const elem = document.getElementById('3d-graph');
        const meshRegistry = {}; 
        let hoverNode = null; 

        const Graph = ForceGraph3D()(elem)
            // NATIVE 2D TEXT RENDERING (Zero 3D overhead)
            .nodeLabel(node => {
                return `<div style="background: rgba(0, 15, 25, 0.9); border: 1px solid #00ffff; padding: 4px 8px; border-radius: 4px; color: #fff; font-size: 12px; letter-spacing: 1px; box-shadow: 0 0 10px rgba(0,255,255,0.3);">
                            ${node.name ? node.name.toUpperCase() : "UNKNOWN"}
                        </div>`;
            })
            .nodeThreeObject(node => {
                const group = new THREE.Group();
                const size = node.val || 4;

                // Static Core (No constant lerping)
                const coreMaterial = new THREE.MeshPhongMaterial({ color: 0x0088ff, emissive: 0x002255, shininess: 80 });
                const core = new THREE.Mesh(new THREE.SphereGeometry(size), coreMaterial);
                group.add(core);

                // Dormant Pulse Ring
                const pulseMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0, depthWrite: false });
                const pulse = new THREE.Mesh(new THREE.SphereGeometry(size), pulseMaterial);
                pulse.userData = { progress: 0, speed: 0.03, isPinging: false };
                group.add(pulse);

                meshRegistry[node.id] = group; 
                return group;
            })
            .onNodeHover(node => {
                hoverNode = node || null;
                elem.style.cursor = node ? 'pointer' : null;
            })
            .onNodeClick(node => fetchNodeData(node.id))
            .onBackgroundClick(() => {
                document.getElementById('inspector-box').style.display = 'none';
            })
            // STATIC EDGES (No particles)
            .linkColor(() => 'rgba(0, 255, 255, 0.3)')
            .linkWidth(0.5);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        Graph.scene().add(ambientLight);

        // --- CINEMATIC IDLE STATE ---
        let isIdle = false;
        let idleStartTime = 0;
        let interactionTimeout = null;

        function resetIdleTimer() {
            isIdle = false;
            clearTimeout(interactionTimeout);
            
            // Wait 4 seconds after the user stops interacting
            interactionTimeout = setTimeout(() => {
                isIdle = true;
                idleStartTime = Date.now();
                Graph.zoomToFit(2000, 100); 
            }, 4000);
        }

        // Bind to all standard interaction events on the graph container
        elem.addEventListener('mousemove', resetIdleTimer);
        elem.addEventListener('mousedown', resetIdleTimer);
        elem.addEventListener('wheel', resetIdleTimer);
        elem.addEventListener('touchstart', resetIdleTimer);

        resetIdleTimer();
            
        // --- HIGH-PERFORMANCE TELEMETRY RENDER LOOP ---
        (function animateTelemetry() {
            requestAnimationFrame(animateTelemetry);

            Object.keys(meshRegistry).forEach(uid => {
                const group = meshRegistry[uid];
                
                // Safety check: ensure the group has the pulse mesh
                if (group && group.children.length > 1) {
                    const pulse = group.children[1];

                    if (pulse.userData.isPinging) {
                        pulse.userData.progress += pulse.userData.speed;
                        const currentScale = 1 + (pulse.userData.progress * 1.5);
                        pulse.scale.set(currentScale, currentScale, currentScale);
                        pulse.material.opacity = Math.max(0, 0.6 * (1 - pulse.userData.progress)); 

                        if (pulse.userData.progress >= 1.0) {
                            pulse.userData.isPinging = false;
                            pulse.userData.progress = 0;
                            pulse.material.opacity = 0;
                            pulse.scale.set(1, 1, 1);
                        }
                    }
                }
            });
            
            // Cinematic Orbit
            if (isIdle && Date.now() - idleStartTime > 2000) {
                const cam = Graph.camera();
                const distance = Math.hypot(cam.position.x, cam.position.z);
                const currentAngle = Math.atan2(cam.position.z, cam.position.x);
                const newAngle = currentAngle + 0.0005;
                
                Graph.cameraPosition({
                    x: distance * Math.cos(newAngle),
                    z: distance * Math.sin(newAngle),
                    y: cam.position.y 
                });
            }
        })();

        function triggerSequentialPulse(uids) {
            uids.forEach((uid, index) => {
                setTimeout(() => {
                    const group = meshRegistry[uid];
                    if (group && group.children.length > 1) {
                        const pulse = group.children[1];
                        pulse.userData.progress = 0;
                        pulse.userData.isPinging = true;
                    }
                }, index * 200); 
            });
        }

        async function fetchNodeData(uid) {
            try {
                const res = await fetch(`/api/node/${uid}`);
                const data = await res.json();
                
                document.getElementById('inspector-box').style.display = 'block';
                document.getElementById('inspect-name').innerText = data.display_name ? data.display_name.toUpperCase() : "UNKNOWN";
                document.getElementById('inspect-uid').innerText = `UID: ${data.uid} | CLASS: ${data.label}`;
                
                if (data.properties && data.properties.length > 0) {
                    const propsHtml = data.properties.map(p => 
                        `<div class="prop-row"><span class="prop-key">${p.key}</span><span class="prop-val">${p.value}</span></div>`
                    ).join('');
                    document.getElementById('inspect-props').innerHTML = propsHtml;
                } else {
                    document.getElementById('inspect-props').innerHTML = '<div style="color: #448888; margin-top: 10px;">No properties assigned.</div>';
                }
            } catch (e) { console.error("Inspection failed", e); }
        }

        // --- SYNCHRONIZATION & TELEMETRY ---
        let currentGraphHash = "";

        async function syncGraph() {
            try {
                const res = await fetch('/api/graph');
                const data = await res.json();
                const newHash = JSON.stringify(data);
                
                if (newHash !== currentGraphHash) {
                    currentGraphHash = newHash;
                    
                    const nodeDegree = {};
                    data.links.forEach(link => {
                        const source = typeof link.source === 'object' ? link.source.id : link.source;
                        const target = typeof link.target === 'object' ? link.target.id : link.target;
                        nodeDegree[source] = (nodeDegree[source] || 0) + 1;
                        nodeDegree[target] = (nodeDegree[target] || 0) + 1;
                    });

                    data.nodes.forEach(node => {
                        const links = nodeDegree[node.id] || 0;
                        node.val = Math.max(3, Math.min(links * 1.2, 12)); 
                    });

                    Graph.graphData(data);
                }
            } catch (e) {
                console.error("[!] Graph Sync Failed. Check API output:", e);
            }
        }

        syncGraph();

        async function updateTelemetry() {
            try {
                const res = await fetch('/api/telemetry');
                const data = await res.json();
                
                const statusEl = document.getElementById('system-status');
                statusEl.innerText = data.state;
                statusEl.style.color = data.state === 'NOMINAL' ? '#00ffff' : '#ff0044';
                
                if (data.memory && data.memory.length > 0) {
                    // Safe filter: Only System observations or AI Tool Calls
                    const agenticMemory = data.memory.filter(m => m.role === 'system' || (m.role === 'model' && m.tool_calls));
                    
                    const recentMemory = agenticMemory.slice(-6);
                    
                    const log = recentMemory.map(m => {
                        let role = "SYS";
                        let content = "Executing operational logic...";
                        
                        if (m.tool_calls && m.tool_calls.length > 0) {
                            role = "CORE";
                            content = `INITIATE: ${m.tool_calls[0].tool_name}`;
                        } else if (m.content) {
                            role = "SYS";
                            content = m.content.length > 80 ? m.content.substring(0, 77) + "..." : m.content;
                            content = content.replace(/\n/g, ' | '); 
                        }
                        
                        return `> [${role}] ${content}`;
                    }).join('<br><br>');
                    
                    document.getElementById('memory-log').innerHTML = log || "<span style='color: #448888;'>Awaiting Operational Logic...</span>";
                } else {
                    document.getElementById('memory-log').innerHTML = "<span style='color: #448888;'>Awaiting Agentic Interaction...</span>";
                }

                if (data.active_nodes && data.active_nodes.length > 0) {
                    triggerSequentialPulse(data.active_nodes);
                }
                
                syncGraph();
            } catch (e) {}
        }
        setInterval(updateTelemetry, 2000);

        // --- UPLINK TERMINAL LOGIC ---
        const chatInput = document.getElementById('chat-input');
        const chatLog = document.getElementById('chat-log');

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            
            if (role === 'user') {
                msgDiv.className = 'msg-user';
                msgDiv.innerText = `USER: ${text}`;
            } else if (role === 'ai') {
                msgDiv.className = 'msg-ai';
                msgDiv.innerText = `CORE: ${text}`; 
            } else {
                msgDiv.className = 'msg-sys';
                msgDiv.innerText = text;
            }
            
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        chatInput.addEventListener('keypress', async function (e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                const text = this.value.trim();
                this.value = ''; 
                
                appendMessage('user', text);
                
                const sysMsg = chatLog.querySelector('.msg-sys');
                if (sysMsg) sysMsg.remove();

                try {
                    const res = await fetch('/api/interact', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: text })
                    });
                    
                    const data = await res.json();
                    if (data.status === 'success') {
                        appendMessage('ai', data.result);
                    } else {
                        appendMessage('sys', `[ERROR] ${data.result}`);
                    }
                } catch (err) {
                    appendMessage('sys', '[FATAL] Link to Cortex lost.');
                }
            }
        });
    </script>
</body>
</html>
